[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cartog"
description = "Cartography for codebases: maps source files with tree-sitter + SCIP into JSON + Mermaid"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Cartog Contributors" }
]
keywords = [
    "code-graph",
    "static-analysis",
    "tree-sitter",
    "scip",
    "mermaid",
    "code-visualization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["version"]
dependencies = [
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "protobuf>=4.21.0",
    "typer>=0.12.0",
    "pathspec>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "grimp>=3.0",
    "grpcio-tools>=1.50.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/rishi-0205/cartog"
Repository = "https://github.com/rishi-0205/cartog"
Issues = "https://github.com/rishi-0205/cartog/issues"

[project.scripts]
cartog = "cartog.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["cartog*"]

[tool.setuptools.dynamic]
version = { attr = "cartog.__version__" }

[tool.setuptools.package-data]
cartog = ["scip/*.js", "render/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["samples", "venv", ".cartog", "cartog-out"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    "samples",
    "cartog-out",
    "venv",
    ".scratch",
    # Fixture repositories are inputs to the parser; rewriting them would shift
    # the line numbers the parser tests assert on.
    "tests/fixtures",
    # Raw evidence transcripts are historical records and must not be edited.
    "docs/evidence",
    # Generated by grpcio-tools from scip.proto ("DO NOT EDIT").
    "cartog/scip/scip_pb2.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # 230 lines are longer than 120 columns. Reflowing them now would bury the
    # E1 module moves in whitespace churn; the cleanup pass (R12) reflows them.
    "E501",
    # 167 `Optional[X]` annotations. The conversion lands with the CLI split
    # (R11), which rewrites those signatures anyway.
    "UP045",
    # Typer commands must declare `typer.Option(...)`/`typer.Argument(...)` in
    # the function signature; this is the documented Typer idiom, not a bug.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Test scaffolding: module-level imports after fixtures, unused locals kept for
# readability, and `zip()` over parallel lists. Revisit in the R12 cleanup pass.
"tests/*.py" = ["E402", "F841", "B023", "B905"]
